# 史脉 · CI（V1.0.1）
# 本地 scripts/verify.ps1 为权威门禁；本工作流在 GitHub 上复刻同一组检查。
# 说明：仓库根目录没有 package.json，所有 Node 依赖都通过 frontend/node_modules 解析，
# 因此 pnpm install 只在 frontend 目录执行，数据脚本从仓库根目录调用。

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend · tsc / data / contracts / build / tests / evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Validate data
        working-directory: .
        run: node scripts/validate-data.mjs

      - name: Deterministic generators (--check)
        working-directory: .
        run: |
          node scripts/build-persons.mjs --check
          node scripts/extract-sources.mjs --check
          node scripts/gen-frontend-types.mjs --check
          node scripts/export-snapshot.mjs --check
          node scripts/validate-contract.mjs

      - name: Frontend unit tests
        run: pnpm exec vitest run

      - name: Golden evals (contract mode)
        working-directory: .
        run: node scripts/run-evals.mjs --mode contract

      - name: Build
        run: pnpm build

  backend:
    name: backend · compile / contracts / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Compile check
        run: python -m compileall -q .

      - name: Contracts check
        run: python scripts/export_contracts.py --check

      - name: Pytest
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "tests/ 尚未创建，跳过"; fi
