<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; padding: 40px; background: #f5f1e8; font-family: "Microsoft YaHei", sans-serif; color: #2e2a24; }
  h2 { font-size: 13px; font-weight: 600; color: #8b0000; letter-spacing: .08em; margin: 0 0 14px; }

  .cell small { font-size: 11px; color: #8a7f72; }
  .sizes { display: flex; align-items: end; gap: 12px; }
  svg { color: #8b0000; }
