<!doctype html>
<html lang="zh-CN">

<style>
  body { margin: 0; padding: 30px; background: #f7f3ea; font-family: "Microsoft YaHei", sans-serif; color: #2e2a24; }
  h2 { font-size: 13px; font-weight: 600; color: #8b0000; letter-spacing: .08em; margin: 0 0 16px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 18px 12px; border: 1px solid #e5dccd; border-radius: 12px; background: #fffdf8; }
  .cell small { font-size: 11px; color: #8a7f72; }
  .sizes { display: flex; align-items: end; gap: 14px; }
  .navmock { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #332923; letter-spacing: .06em; }
