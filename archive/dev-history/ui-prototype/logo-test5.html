<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; padding: 30px; background: #f7f3ea; font-family: "Microsoft YaHei", sans-serif; color: #2e2a24; }
  h2 { font-size: 13px; font-weight: 600; color: #8b0000; letter-spacing: .08em; margin: 0 0 16px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 18px 12px; border: 1px solid #e5dccd; border-radius: 12px; background: #fffdf8; }
  .cell small { font-size: 11px; color: #8a7f72; }
  .sizes { display: flex; align-items: end; gap: 16px; }
  .navmock { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #332923; letter-spacing: .06em; }
  .navmock small { display: block; font-size: 8px; letter-spacing: .2em; color: #a07e6e; font-weight: 700; }
</style>
</head>
<body>
<h2>P 系：史藏于 S 上弦 · 160px + 导航 38px</h2>
<div class="row">

  <!-- P1: 同色细史在上弦空白 -->

    </div>
    <small>P1 · 同色细史</small>
  </div>

  <!-- P2: 浅色史 -->
  <div class="cell">
    <div class="sizes">
      <svg width="160" height="160" viewBox="0 0 48 48" fill="none">
        <defs><linearGradient id="gp2" x1="8" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#a8322a"/><stop offset=".55" stop-color="#8b0000"/><stop offset="1" stop-color="#5a0704"/></linearGradient></defs>

        <g stroke="#c07a66" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M21 14.6h7.8"/><path d="M24.9 11.6v10.8"/><path d="M21.8 16.6h6.2v4.6h-6.2z"/><path d="M24.9 21.2c.2 1.7 1.7 3 4 3.5"/></g>

    </div>
    <small>P2 · 浅色史</small>
  </div>

  <!-- P3: 史更大，竖线延长，口跨中 -->
  <div class="cell">
    <div class="sizes">
      <svg width="160" height="160" viewBox="0 0 48 48" fill="none">
        <defs><linearGradient id="gp3" x1="8" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#a8322a"/><stop offset=".55" stop-color="#8b0000"/><stop offset="1" stop-color="#5a0704"/></linearGradient></defs>
        <path d="M39.4 14.2C35 8 24.6 6 18 10.2c-6.1 3.9-5.4 10.2 1.1 13.4 6.2 3 13.6 5 14.4 10.1.7 4.7-5.5 8.3-11.7 8-4.6-.2-8.6-2-11.1-5.2" stroke="url(#gp3)" stroke-width="4.6" stroke-linecap="round"/>
        <g stroke="url(#gp3)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M19.6 14h10.8"/><path d="M24.8 10.8v13"/><path d="M20.6 16.2h8.4v5.8h-8.4z"/><path d="M24.8 22c.3 2.6 2.6 4.5 6 5.1"/></g>
      </svg>
      <div class="navmock"><svg width="38" height="38" viewBox="0 0 48 48" fill="none"><path d="M39.4 14.2C35 8 24.6 6 18 10.2c-6.1 3.9-5.4 10.2 1.1 13.4 6.2 3 13.6 5 14.4 10.1.7 4.7-5.5 8.3-11.7 8-4.6-.2-8.6-2-11.1-5.2" stroke="#8b0000" stroke-width="4.6" stroke-linecap="round"/><g stroke="#8b0000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M19.6 14h10.8"/><path d="M24.8 10.8v13"/><path d="M20.6 16.2h8.4v5.8h-8.4z"/><path d="M24.8 22c.3 2.6 2.6 4.5 6 5.1"/></g></svg><span><small>SHIMAI · CONSOLE</small>史脉问答</span></div>
    </div>
    <small>P3 · 大史居上弦</small>
  </div>

  <!-- P4: 史在中宫（S 中段穿过口） -->
  <div class="cell">
    <div class="sizes">
      <svg width="160" height="160" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="gp4" x1="8" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#a8322a"/><stop offset=".55" stop-color="#8b0000"/><stop offset="1" stop-color="#5a0704"/></linearGradient>
          <mask id="mp4" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#fff"/><g stroke="#000" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M19.2 17.4h11"/><path d="M24.6 13.4v15"/><path d="M20.4 21.6h8.4v5.8h-8.4z"/><path d="M24.6 27.4c.3 2.3 2.2 4 5 4.6"/></g></mask>
        </defs>
        <path mask="url(#mp4)" d="M38.8 13.6C34.6 7.8 24.4 6 18 10c-5.9 3.7-5.3 9.8 1.1 12.9 6 2.9 13.2 4.9 14 9.8.7 4.6-5.3 8-11.4 7.8-4.5-.2-8.4-1.9-10.9-5" stroke="url(#gp4)" stroke-width="5.2" stroke-linecap="round"/>
        <g stroke="url(#gp4)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M19.2 17.4h11"/><path d="M24.6 13.4v15"/><path d="M20.4 21.6h8.4v5.8h-8.4z"/><path d="M24.6 27.4c.3 2.3 2.2 4 5 4.6"/></g>
      </svg>
      <div class="navmock"><svg width="38" height="38" viewBox="0 0 48 48" fill="none"><path d="M38.8 13.6C34.6 7.8 24.4 6 18 10c-5.9 3.7-5.3 9.8 1.1 12.9 6 2.9 13.2 4.9 14 9.8.7 4.6-5.3 8-11.4 7.8-4.5-.2-8.4-1.9-10.9-5" stroke="#8b0000" stroke-width="5.2" stroke-linecap="round"/><g stroke="#8b0000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M19.2 17.4h11"/><path d="M24.6 13.4v15"/><path d="M20.4 21.6h8.4v5.8h-8.4z"/><path d="M24.6 27.4c.3 2.3 2.2 4 5 4.6"/></g></svg><span><small>SHIMAI · CONSOLE</small>史脉问答</span></div>
    </div>

</div>
</body>
</html>
